<div class="filter-bar">
  <form class="filter-form" action="/" method="get">
    <input class="search-input" type="search" name="q" value="{{.Query}}" placeholder="Search posts" aria-label="Search posts">
    <button class="search-btn" type="submit">Search</button>
  </form>
  <a class="popular-link" href="/?order_by=popular">Popular</a>
</div>
